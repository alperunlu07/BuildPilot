[package]
name = "buildpilot-desktop"
version = "0.1.0"
description = "BuildPilot system-tray desktop app (Tauri v2)"
authors = ["BuildPilot"]
edition = "2021"
rust-version = "1.77"

# The library crate that holds the whole app — `main.rs` is a thin launcher so
# the same code can be reused by mobile/test targets, mirroring the Tauri v2
# project template.
[lib]
name = "buildpilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
dirs = "5"

# Single-instance is desktop-only (it's a no-op concept on mobile), so gate the
# plugin to desktop targets — same pattern Tauri's own examples use.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
# Smaller, faster-to-ship binaries for the packaged app.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
