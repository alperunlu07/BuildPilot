<!doctype html>
<!--
  Local loading shell. The real UI is the BuildPilot web SPA served from the
  server's own origin (http://127.0.0.1:35700 by default). The Rust side opens
  the main window directly on that external URL once the server is healthy, so
  this page is only ever shown for the brief moment before navigation (and as
  Tauri's required `frontendDist` entry point).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildPilot</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f1a;
        color: #c7d2e0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      .wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        flex-direction: column;
        gap: 14px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #1e2a44;
        border-top-color: #4f8cff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div>Starting BuildPilot…</div>
    </div>
  </body>
</html>
