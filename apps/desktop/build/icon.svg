<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BuildPilot launcher icon — sky-blue rounded tile + Compass glyph mark
       from docs/designs/icons.jsx. Compass = navigate/orient (the dashboard
       points you at the next thing to build). Kept maskable-safe with 96px
       padding so neither the needle tips nor the tick marks get clipped on
       Android's masked-icon shapes. -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0ea5e9"/>
  <g transform="translate(96 96) scale(13.333)">
    <!-- Outer ring -->
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <!-- Hub -->
    <circle cx="12" cy="12" r="1.6" fill="#f8fafc"/>
    <!-- North needle (bright) -->
    <path d="M12 4 L14 11 L12 13 L10 11 Z" fill="#f8fafc" opacity="0.95"/>
    <!-- South needle (dim) -->
    <path d="M12 20 L10 13 L12 11 L14 13 Z" fill="#f8fafc" opacity="0.35"/>
    <!-- Cardinal tick marks -->
    <line x1="12" y1="2" x2="12" y2="3.6" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="20.4" x2="12" y2="22" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="2" y1="12" x2="3.6" y2="12" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20.4" y1="12" x2="22" y2="12" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
