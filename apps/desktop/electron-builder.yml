appId: dev.buildpilot.desktop
productName: BuildPilot
copyright: Copyright © BuildPilot

directories:
  output: release
  buildResources: build

# Only the compiled main process + assets go inside the app. The server and
# the web bundle ride along as extra resources so they live as real files on
# disk (native addons + pino workers can't run from inside an asar archive).
files:
  - dist/**
  - build/**
  - package.json

extraResources:
  - from: server
    to: server
  - from: ../../apps/web/dist
    to: web/dist
  # Real node_modules for the externalised server deps (see bundle-server.mjs).
  # Generated by `pnpm deploy` / `pnpm --filter @buildpilot/server install` into
  # apps/desktop/server/node_modules before packaging — see docs/DESKTOP.md.
  - from: server/node_modules
    to: server/node_modules
    filter:
      - '**/*'

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Launch automatically after install and create a Start-menu + desktop entry.
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Background/accessory app: no Dock icon (we also call app.dock.hide()).
  extendInfo:
    LSUIElement: true

linux:
  target:
    - AppImage
  category: Development
  icon: build/icon.png
