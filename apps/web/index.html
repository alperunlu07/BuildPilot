<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the dark theme bleed into the iOS safe areas
         (notch + home-indicator) when installed as a PWA. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="description" content="Local CI/CD with web dashboard and React Flow pipeline editor" />
    <!-- PWA manifest (Cluster 10.G). Also unblocks Phase-3 Web Push because
         browsers require a registered SW + manifest before push permission. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Both names ship for cross-browser PWA install. Chrome 108+ deprecated
         the apple-* form and warns in DevTools; iOS Safari still requires
         it. Ship both so neither side complains. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BuildPilot</title>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
